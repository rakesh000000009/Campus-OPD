version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campus_opd_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: opd_user
      POSTGRES_PASSWORD: opd_password
      POSTGRES_DB: campus_opd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opd_user -d campus_opd"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_opd_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://opd_user:opd_password@postgres:5432/campus_opd
      JWT_SECRET: campus-opd-secret-jwt-key-2026
      JWT_EXPIRES_IN: 24h
      CLIENT_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
