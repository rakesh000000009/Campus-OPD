# Campus OPD - Netlify configuration
# Frontend: Vite build in frontend/ published as static site
# Backend:  Express API wrapped in a Netlify Function (netlify/functions/api.mts)

[build]
  base = "."
  # Install function dependencies (root), then install & build the frontend.
  command = "npm install --no-audit --no-fund && cd frontend && npm ci && npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[functions]
  # Bundle everything the function imports (backend/ uses ESM/CJS via bundler)
  node_bundler = "esbuild"

# Single Page App: send all non-API routes to index.html so React Router works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: ensure pretty URLs for paths that exist as files are still handled
# (default Netlify behaviour already serves static files first)
